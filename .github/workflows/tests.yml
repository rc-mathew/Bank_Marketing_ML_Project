name: ML Pipeline Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib pytest

      - name: Compile core modules
        run: |
          python -m py_compile src/data/load_data.py
          python -m py_compile src/data/validate_data.py
          python -m py_compile src/features/build_features.py
          python -m py_compile src/models/save_model.py

      - name: Run automated tests
        run: |
          python -m pytest tests/test_model.py -v